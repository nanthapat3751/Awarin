services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boq
      POSTGRES_PASSWORD: boq_dev_password
      POSTGRES_DB: systemboq
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boq -d systemboq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev DB browser at http://localhost:5050. Desktop mode (no pgAdmin login) since
  # it's only reachable from this machine; the dev DB connection is pre-registered via
  # servers.json, so you only enter the Postgres password on first connect.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      # Must be a "normal" domain -- pgAdmin rejects reserved TLDs like .local on startup.
      PGADMIN_DEFAULT_EMAIL: admin@systemboq.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  # Load balancer หน้า API หลายตัว — ไม่ขึ้นตอน `docker compose up` ปกติ ใช้ผ่าน `npm run dev:lb`
  # (หรือ `docker compose --profile lb up -d lb`) · API รันบนเครื่องที่พอร์ต 4001/4002 ดู docker/nginx/lb.conf
  lb:
    image: nginx:1.27-alpine
    profiles: ["lb"]
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      # เครื่องแม่ (ที่ API รันอยู่) — ดู docker/nginx/start.sh
      - "api-host:host-gateway"
    # start.sh แปลง api-host เป็น IPv4 ก่อนเริ่ม nginx (เหตุผลอยู่ในไฟล์) — เรียกผ่าน sh ไม่ต้องพึ่งสิทธิ์ execute ของไฟล์บน Windows
    command: ["/bin/sh", "/etc/nginx/start.sh"]
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/lb.conf.in:ro
      - ./docker/nginx/start.sh:/etc/nginx/start.sh:ro

volumes:
  db_data:
  pgadmin_data:
