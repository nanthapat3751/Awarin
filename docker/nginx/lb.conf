# Load balancer หน้า API หลายตัว (ใช้กับ `npm run dev:lb` — ดู scripts/dev-lb.mjs และ README)
#
# ทำไมตั้งแบบนี้:
#   least_conn   คำขอหนักไม่เท่ากัน (สร้าง PDF ใช้ Chromium ~1-2 วิ ส่วนใหญ่เป็นอ่าน JSON เร็ว ๆ)
#                ส่งไปตัวที่ถืองานค้างน้อยสุดดีกว่าวนตามลำดับที่อาจกองงานหนักไว้ตัวเดียว
#   max_fails    ตัวไหนเชื่อมต่อไม่ได้ 3 ครั้งใน 10 วิ = พักไว้ 10 วิ ไม่ส่งงานไปตาย
#   keepalive    ใช้การเชื่อมต่อไปหา API ซ้ำ ไม่เปิดใหม่ทุกคำขอ — API ตั้ง keepAliveTimeout 65 วิ
#                ให้นานกว่าฝั่งนี้ (60 วิ) ไม่งั้นจะเจอ 502 แบบสุ่มตอน API ตัดการเชื่อมต่อก่อน
#   next_upstream ตัวแรกล่ม/ตอบ 502-503 (กำลังปิด) ลองอีกตัวให้เลย — nginx ไม่ลองซ้ำคำขอ POST/PATCH/
#                DELETE ที่ส่งไปแล้ว (non_idempotent ไม่ได้เปิด) กันบันทึกซ้ำ/ออกเลขเอกสารซ้ำ
#
# ไม่ต้องมี sticky session: session อยู่ในตาราง Session ทุกตัวเห็นเหมือนกัน
# ตัวนับ rate limit อยู่ในตาราง RateLimitBucket · งานรายวันจองรอบใน ScheduledRun

# access log มีเลขอ้างอิงคำขอ + เครื่องที่รับงาน + เวลาที่เครื่องนั้นใช้ — ผู้ใช้แจ้ง requestId จากหน้าจอ error
# มา ค้นบรรทัดนี้เจอว่าไปตกตัวไหน แล้วไปหา "[<requestId>]" ใน log ของ API ตัวนั้น (ดู server/src/lib/request-id.ts)
log_format systemboq '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rid=$request_id upstream=$upstream_addr upstream_time=$upstream_response_time';

upstream systemboq_api {
    # หน่วยความจำร่วมของทุก worker — ไม่มี zone แต่ละ worker นับงานค้าง/สถานะล่มของตัวเอง
    # คำขอที่ตกคนละ worker จะเลือกตัวแรกเหมือนกันหมด (ทดสอบแล้ว: 6/6 ไปตัวเดียว)
    zone systemboq_api 64k;
    least_conn;
    server api-host:4001 max_fails=3 fail_timeout=10s;
    server api-host:4002 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log systemboq;

    # ไฟล์แนบใบเสนอราคาจำกัด 20 MB ที่ API — เผื่อ multipart overhead
    client_max_body_size 25m;

    # ตรวจสุขภาพของ LB เอง (ไม่วิ่งไปถึง API)
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://systemboq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # API ตั้ง TRUST_PROXY=1 = เชื่อ hop เดียวนี้ — rate limit/ล็อกบัญชี/audit log ได้ IP จริงของ client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # เลขอ้างอิงคำขอ — nginx สร้างให้ทุกคำขอ API ใช้เลขเดียวกันใน log และส่งกลับใน header
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 3s;
        # สำรอง/กู้ข้อมูลด้วยมือ และ PDF หลายหน้า ใช้เวลานานกว่าคำขอทั่วไป
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
