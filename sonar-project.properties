sonar.projectKey=systemboq
sonar.projectName=SystemBOQ
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# monorepo (npm workspaces): API + staff-app + client-app + shared-types
sonar.sources=server/src,server/prisma,server/scripts,staff-app/src,client-app/src,packages/shared-types/src
sonar.tests=server/tests
sonar.test.inclusions=server/tests/**/*.test.ts

# migrations เป็น SQL ที่ Prisma สร้าง — ไม่ใช่โค้ดที่เขียนเอง
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,server/prisma/migrations/**

sonar.typescript.tsconfigPaths=server/tsconfig.json,staff-app/tsconfig.app.json,client-app/tsconfig.app.json,packages/shared-types/tsconfig.json

# coverage: ก่อนสแกนรัน (ใน server/) `npx jest -c jest.coverage.config.js --coverage`
# แล้ว `node sonar-reports/fix-lcov-paths.cjs` (จากโฟลเดอร์ราก) ให้ path ตรงกับที่ตัวสแกนใน docker มอง
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info

# ไม่นับใน coverage (ยังถูกสแกนหาปัญหาครบทุกไฟล์ตามปกติ — ข้อนี้มีผลกับตัวเลข coverage อย่างเดียว):
# - staff-app / client-app: หน้าจอ React ไม่มี unit test — ทดสอบผ่านเบราว์เซอร์ด้วย Robot Framework
#   (robot-tests/) ซึ่งไม่ได้สร้างไฟล์ coverage ให้ SonarQube อ่าน
# - server/scripts, server/prisma: สคริปต์ที่คนสั่งรันเองทางบรรทัดคำสั่ง (seed, สำรอง/กู้, migrate DB ทดสอบ)
#   ไม่ใช่โค้ดที่ระบบเรียกตอนทำงาน
# shared-types ไม่ได้ยกเว้น — วัดจริงจากเทสต์ของ server ที่เรียกใช้อยู่
sonar.coverage.exclusions=staff-app/**,client-app/**,server/scripts/**,server/prisma/**
sonar.javascript.node.maxspace=6144
