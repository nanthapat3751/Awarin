# nginx ในคอนเทนเนอร์ web — เสิร์ฟไฟล์ที่ build แล้ว (HTTPS/โดเมนอยู่ที่ nginx บนเครื่อง ดู deploy/nginx.conf)
# ทั้งสองเว็บเป็น SPA: path ที่ไม่มีไฟล์จริงตอบ index.html ให้ React Router จัดการต่อ

map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";  # ไฟล์ที่ Vite ใส่ hash ในชื่อแล้ว
  default     "no-cache";                              # index.html ต้องโหลดใหม่ทุกครั้งหลัง deploy
}

server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/staff;
  add_header Cache-Control $cache_control always;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8082;
  server_name _;
  root /usr/share/nginx/client;
  add_header Cache-Control $cache_control always;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
