# nginx บนเครื่อง VPS — รับโดเมนจริงแล้วส่งต่อเข้าคอนเทนเนอร์ (พอร์ต 127.0.0.1 เท่านั้น)
# ติดตั้ง:  sed 's/example\.com/<โดเมน>/g' nginx.conf > /etc/nginx/sites-available/awarin
# certbot --nginx จะเติมส่วน HTTPS (443) และ redirect จาก http ให้เอง

# ส่ง IP จริงของผู้ใช้ให้ API (TRUST_PROXY=1) · ws/keep-alive ไม่ได้ใช้
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

# www → โดเมนหลัก (คุกกี้/CORS ผูกกับโดเมนหลักชื่อเดียว)
server {
  listen 80;
  server_name www.example.com;
  return 301 https://example.com$request_uri;
}

# เว็บลูกค้า
server {
  listen 80;
  server_name example.com;
  location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# เว็บพนักงาน
server {
  listen 80;
  server_name staff.example.com;
  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API
server {
  listen 80;
  server_name api.example.com;
  # คำขอใหญ่สุด = ลูกค้าแจ้งโอนพร้อมสลิป 3 ไฟล์ × 10MB (แอปตรวจขนาดรายไฟล์เอง) — เผื่อหัวคำขอ
  client_max_body_size 40m;
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # สร้าง PDF หลายหน้า/Excel ใหญ่อาจใช้เวลา
    proxy_read_timeout 120s;
  }
}
